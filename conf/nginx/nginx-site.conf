server {
  # Render provisions and terminates SSL
  listen 80;

  # Make site accessible from http://localhost/
  server_name _;

  root /var/www/html/public;
  index index.html index.htm index.php;

  # Disable sendfile as per https://docs.vagrantup.com/v2/synced-folders/virtualbox.html
  sendfile off;

  # Add stdout logging
  error_log /dev/stdout info;
  access_log /dev/stdout;

  # block access to sensitive information about git
  location /.git {
    deny all;
    return 403;
  }

  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-XSS-Protection "1; mode=block";
  add_header X-Content-Type-Options "nosniff";

  charset utf-8;

  location / {
      try_files $uri $uri/ /index.php?$query_string;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  error_page 404 /index.php;
   location ~ (^/docs/asset/.*) {
     try_files $uri $uri/ /index.php$is_args$args;
   }
  # Service Worker — must not be cached by browsers
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    expires off;
  }

  location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg)$ {
    expires 5d;
  }

  location ~ \.php$ {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php-fpm.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    include fastcgi_params;
  }

  # Deny scanner targets (archives, dumps, configs) before hitting PHP
  location ~* \.(zip|tar|gz|tgz|rar|7z|sql|bak|backup|old|dist|orig|save|env|yml|yaml|ini|log|conf|config|sh|bash)$ {
    log_not_found off;
    access_log off;
    deny all;
    return 404;
  }

  # Deny common CMS & database probe paths
  location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|xmlrpc\.php|phpmyadmin|pma|adminer|\.git|\.env) {
    log_not_found off;
    access_log off;
    deny all;
    return 404;
  }

  # Deny access to hidden files/directories (except .well-known)
  location ~ /\.(?!well-known).* {
    log_not_found off;
    access_log off;
    deny all;
    return 404;
  }
}