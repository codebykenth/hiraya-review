# ==============================================================================
# Security & Bot Shield Configuration for Hiraya Review (ServerSideUp / Nginx)
# Injected into the Nginx `server { ... }` block via `/etc/nginx/server-opts.d/`
# ==============================================================================

# 1. Never forward missing static assets to PHP-FPM
# Short-circuits non-existent JS, CSS, maps, fonts, and injected URL probe suffixes (e.g., >; / %3E;)
location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|webp|svg|woff2?|ttf|eot)$ {
    log_not_found off;
    access_log off;
    try_files $uri =404;
}

# 2. Immediately drop database dumps, backups, archives, SSH keys, certs, and config files
# Prevents scanner bursts from hitting PHP-FPM and causing 504 Gateway Timeouts
location ~* \.(sqlite|db|sql|gz|tgz|zip|tar|rar|7z|bak|backup|old|save|pem|key|crt|pub|pfx|p12|enc|properties|py|tf|tfstate|tfvars|env|yml|yaml|ini|log|conf|config|sh|bash)$ {
    log_not_found off;
    access_log off;
    return 404;
}

# 3. Block sensitive files without extensions (e.g. SSH keys, CI/CD, cloud configs)
location ~* ^/(id_rsa|id_ed25519|Jenkinsfile|kubeconfig|local_settings|wp-config) {
    log_not_found off;
    access_log off;
    return 404;
}

# 4. Block framework, cloud, and secrets JSON files (leaving manifest.json safe)
location ~* (firebase|gcp-credentials|service-account|credentials|settings|secrets|ormconfig|appsettings|runtime|runtime-config|static/config|environment|env|config|webpack|stats|asset-manifest)\.json$ {
    log_not_found off;
    access_log off;
    return 404;
}

# 5. Block hidden files and directories (except .well-known for SSL / ACME / Apple)
location ~ /\.(?!well-known).* {
    log_not_found off;
    access_log off;
    return 404;
}

# 6. Block foreign frameworks, CMS, and admin console probe directories
location ~* ^/(_next|_nuxt|_astro|wp-admin|wp-content|wp-includes|wp-json|xmlrpc|phpmyadmin|pma|adminer|cgi-bin|debug|backend|old|site)/ {
    log_not_found off;
    access_log off;
    return 404;
}

# 7. Block rogue PHP script scans — in Laravel, only /index.php is a valid entrypoint
location ~* (phpinfo|info\.php|test\.php|shell\.php|wp-config\.php) {
    log_not_found off;
    access_log off;
    return 404;
}

# 8. Service Worker (PWA) — must not be cached by browsers
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    expires off;
}

# 9. Production Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
