# ==============================================================================
# Security & Bot Shield Configuration for Hiraya Review (ServerSideUp / Nginx)
# Injected into the Nginx `server { ... }` block via `/etc/nginx/site-opts.d/`
# ==============================================================================

# 1. Immediately drop requests for backup archives, dumps, and scripts (404)
# Prevents scanner bursts from hitting PHP-FPM and causing 504 Gateway Timeouts
location ~* \.(zip|tar|gz|tgz|rar|7z|sql|bak|backup|old|dist|orig|save)$ {
    log_not_found off;
    access_log off;
    deny all;
    return 404;
}

# 2. Block framework config probes, environment files, logs, and sensitive data
location ~* \.(env|yml|yaml|ini|log|conf|config|sh|bash)$ {
    log_not_found off;
    access_log off;
    deny all;
    return 404;
}

# 3. Block hidden files and directories (except .well-known for ACME/Apple/SSL)
location ~ /\.(?!well-known).* {
    log_not_found off;
    access_log off;
    deny all;
    return 404;
}

# 4. Block common CMS & database probe paths
location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|xmlrpc\.php|phpmyadmin|pma|adminer|\.git|\.env) {
    log_not_found off;
    access_log off;
    deny all;
    return 404;
}

# 5. Service Worker (PWA) — must not be cached by browsers
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    expires off;
}

# 6. Production Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
